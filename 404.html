<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sayfa Bulunamadı | Vitavolt Global</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .error-wrap {
      min-height: 70vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 3rem 1.5rem;
    }
    .error-code {
      font-size: 6rem; font-weight: 800; line-height: 1;
      background: linear-gradient(135deg, #00AEEF, #38D67A);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .error-title { font-size: 1.75rem; margin: 1rem 0 0.5rem; }
    .error-desc { color: #7A8A9A; margin-bottom: 2rem; max-width: 420px; margin-left: auto; margin-right: auto; }
  </style>
</head>
<body>
  <div class="error-wrap">
    <div>
      <div class="error-code">404</div>
      <h1 class="error-title">Sayfa bulunamadı</h1>
      <p class="error-desc">Aradığınız sayfa taşınmış veya hiç var olmamış olabilir.</p>
      <a href="/" class="btn btn-primary">Ana Sayfaya Dön</a>
      <a href="/contact.html" class="btn btn-outline" style="margin-left:0.75rem">İletişim</a>
    </div>
  </div>
</body>
</html>
